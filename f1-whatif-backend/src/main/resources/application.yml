spring:
  application:
    name: f1-whatif
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/f1whatif}
    username: ${DB_USER:f1}
    password: ${DB_PASSWORD:f1}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches

server:
  port: ${PORT:8080}       # Cloud Run injects PORT

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
