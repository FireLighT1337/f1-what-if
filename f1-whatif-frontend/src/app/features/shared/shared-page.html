@if (entry()?.error; as message) {
  <p role="alert" class="rounded-lg border border-red-900 bg-red-950/50 p-4 text-sm text-red-200">{{ message }}</p>
  <a routerLink="/explorer" class="mt-4 inline-block text-sm text-zinc-400 underline hover:text-white">Open the explorer</a>
} @else if (scenario(); as shown) {
  <header class="mb-4">
    <p class="text-xs uppercase tracking-wide text-zinc-500">Shared scenario</p>
    <h1 class="text-2xl font-semibold tracking-tight">{{ shown.name }}</h1>
    <p class="mt-1 text-sm text-zinc-400">{{ summary() }}</p>
    <button
      type="button"
      class="mt-3 rounded-md border border-zinc-700 px-3 py-1.5 text-sm hover:border-zinc-500"
      (click)="openInExplorer()"
    >
      Open in the explorer
    </button>
  </header>
  <app-standings-table
    [rows]="rows()"
    [season]="shown.seasonYear"
    [queryParams]="driverQuery()"
    status="loaded"
  />
} @else {
  <div class="space-y-2" aria-busy="true" aria-label="Loading shared scenario">
    @for (placeholder of [1, 2, 3, 4, 5, 6]; track placeholder) {
      <div class="h-9 animate-pulse rounded-md bg-zinc-900"></div>
    }
  </div>
}
